name: Build ares kernel (4.14.357)

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '内核源码仓库'
        required: true
        default: 'seriaTvT/kernel_mt6893'
      source_ref:
        description: '源码分支（chopin_kvm = 4.14.357, 支持 ares）'
        required: true
        default: 'chopin_kvm'
      enable_ksu:
        description: '编入 KernelSU'
        type: boolean
        required: true
        default: true
      ksu_variant:
        description: 'resukisu = 手工 hook（本机推荐，不动 KPROBES）；official = 官方 KSU（必须开 KPROBES，MTK 4.14 上有进救援模式的风险）'
        required: true
        default: 'resukisu'
      ksu_ref:
        description: 'KernelSU tag/commit —— 必须和管理器 APK 版本一致（ReSukiSU 管理器 v4.2.0-rc3 = 35171）'
        required: true
        default: 'v4.2.0-rc3'
      enable_gaming:
        description: '游戏性能化 + 功能堆料 defconfig'
        type: boolean
        required: true
        default: true
      defconfig_source:
        description: 'known_good = 用「已验证能启动的 ares 4.14.336 配置」当底（稳）；tree_ares = 用树里的 ares_defconfig（料多但风险高）'
        required: true
        default: 'tree_ares'
      enable_boost:
        description: '第一批加速批次（MTK IO/触控 boost + KSM/FRONTSWAP + squashfs，低风险）'
        type: boolean
        required: true
        default: false
      gpu_max_freq:
        description: 'GPU 最高频 KHz（原厂 886000；935000=小超；上限 950000 由时钟路径锁死）'
        required: true
        default: '886000'
      gpu_max_volt:
        description: 'GPU 最高档电压（mVx100，原厂 80000；935MHz 建议 86250）'
        required: true
        default: '80000'
      enable_wireguard:
        description: '额外编 WireGuard 模块（out-of-tree compat .ko）'
        type: boolean
        required: true
        default: false
      build_modules:
        description: '编译内核模块 (.ko) 并打包 —— GSI 必需：WiFi/蓝牙/指纹/触控/连接都靠它，且我们改了版本串后必须自带模块'
        type: boolean
        required: true
        default: true
      gsi_extra:
        description: '追加 GSI 专用特性批次（Patches/ares_gsi_defconfig_append）'
        type: boolean
        required: true
        default: false
      enable_bbg:
        description: '编入 Baseband-guard（可跳过，减少失败点）'
        type: boolean
        required: true
        default: false
      release_tag:
        description: 'Release 标签（留空=自动）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_NOHASHDIR: "true"
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: 腾出磁盘空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y p7zip-full ccache git curl

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.source_repo }}-${{ inputs.source_ref }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ inputs.source_repo }}-${{ inputs.source_ref }}-

      - name: 取出我们的补丁/配置
        uses: actions/checkout@v4
        with:
          path: buildfiles

      - name: 拉内核源码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: kernel
          fetch-depth: 1

      - name: 工具链 (Mandi-Sa llvm23)
        run: |
          mkdir -p toolchain && cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-23/llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          7za x -bso0 -bsp0 llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          rm -f *.7z
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: 内核信息（源码版本）
        working-directory: kernel
        run: |
          head -5 Makefile
          echo "SRC_HEAD=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 打入 KernelSU
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          if [ "${{ inputs.ksu_variant }}" = "official" ]; then
            # 官方 KernelSU：依赖 KPROBES，版本由 tag 决定（管理器必须同 tag）
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}"
            ls -d KernelSU
            ( cd KernelSU && echo "KSUVER=$(git describe --tags --always)" >> $GITHUB_ENV )
          else
            # ReSukiSU：4.14 走手工 hook（不开 KPROBES），版本钉到与管理器一致的 tag
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s "${{ inputs.ksu_ref }}"
            ls -d KernelSU || true
            cd KernelSU
            KSU_VER=$(git describe --tags --always)
            echo "KSUVER=$KSU_VER" >> $GITHUB_ENV
            # 让内核驱动的版本号 = 该 tag 的发布号（与管理器 APK 一致）
            sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=$(expr $(git rev-list --count HEAD) "+" 30000 "+" 700)/" kernel/Makefile || true
            cd ..
            patch -p1 --forward < $GITHUB_WORKSPACE/buildfiles/Patches/static-symbol-export.patch || echo "::warning::static-symbol-export 补丁未应用"
            patch -p1 --forward < $GITHUB_WORKSPACE/buildfiles/Patches/resukisu-scopemin-hooks.patch || echo "::warning::scopemin-hooks 补丁未应用"
            patch -p1 --forward < $GITHUB_WORKSPACE/buildfiles/Patches/fix_restore_cgroup_file_prefix_handling.patch || echo "::warning::cgroup 补丁未应用"
          fi

      - name: 原厂树小修（缺 include 之类，幂等）
        working-directory: kernel
        run: python3 $GITHUB_WORKSPACE/buildfiles/Patches/tree_fixups.py .

      - name: 补 KSU 手工 hook（原厂树缺钩子调用点）
        if: ${{ inputs.enable_ksu }}
        working-directory: kernel
        run: |
          python3 $GITHUB_WORKSPACE/buildfiles/Patches/ksu_hooks.py .
          echo "=== 打完钩子后的确认 ==="
          for pair in "fs/exec.c:ksu_handle_execveat" "fs/open.c:ksu_handle_faccessat" \
                      "fs/stat.c:ksu_handle_stat" "fs/stat.c:ksu_handle_newfstat_ret" \
                      "fs/stat.c:ksu_handle_fstat64_ret" "kernel/reboot.c:ksu_handle_sys_reboot"; do
            f=${pair%%:*}; s=${pair##*:}
            if grep -q "$s" "$f"; then echo "  OK   $f: $s"; else echo "  MISS $f: $s"; exit 1; fi
          done

      - name: 打入 Baseband-guard
        if: ${{ inputs.enable_bbg }}
        working-directory: kernel
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: GPU 最高档超频（改 OPP 表）
        if: ${{ inputs.gpu_max_freq != '886000' }}
        working-directory: kernel
        run: |
          F=drivers/misc/mediatek/base/power/include/gpufreq_v1/mt6893/mtk_gpufreq_internal_plat.h
          cp "$F" "$F.bak"
          sed -i "s/GPUOP(886000, 80000, 80000, POSDIV_POWER_4, 1875)/GPUOP(${{ inputs.gpu_max_freq }}, ${{ inputs.gpu_max_volt }}, ${{ inputs.gpu_max_volt }}, POSDIV_POWER_4, 1875)/g" "$F"
          echo "=== OPP 表最高档改动 ==="
          diff -u "$F.bak" "$F" | head -20 || true
          echo "改动处数: $(grep -c 'GPUOP(${{ inputs.gpu_max_freq }}' "$F")"

      - name: 追加 defconfig + 署名
        run: |
          cd kernel
          KNOWN_GOOD=""
          if [ "${{ inputs.defconfig_source }}" = "known_good" ]; then
            KNOWN_GOOD=1
            echo "=== 用「已验证能启动的 ares 4.14.336 配置」当底（稳定优先）==="
            cp $GITHUB_WORKSPACE/buildfiles/Patches/ares_defconfig_known_good arch/arm64/configs/ares_defconfig
            wc -l arch/arm64/configs/ares_defconfig
          fi
          if [ -z "$KNOWN_GOOD" ]; then
            # 基础追加（来自已验证配方）
            cat $GITHUB_WORKSPACE/buildfiles/Patches/ares_user_defconfig_append >> arch/arm64/configs/ares_defconfig
            # 游戏化/功能堆料（之前漏掉了！）
            if [ "${{ inputs.enable_gaming }}" = "true" ]; then
              cat $GITHUB_WORKSPACE/buildfiles/Patches/ares_gaming_defconfig_append >> arch/arm64/configs/ares_defconfig
            fi
            # 第一批加速批次（低风险：MTK IO/触控 boost 等）
            if [ "${{ inputs.enable_boost }}" = "true" ]; then
              cat $GITHUB_WORKSPACE/buildfiles/Patches/ares_boost_defconfig_append >> arch/arm64/configs/ares_defconfig
            fi
            # GSI 专用特性批次（第二批：把能开的功能尽量开齐，已剔除冲突项）
            if [ "${{ inputs.gsi_extra }}" = "true" ]; then
              cat $GITHUB_WORKSPACE/buildfiles/Patches/ares_gsi_defconfig_append >> arch/arm64/configs/ares_defconfig
            fi
          else
            echo "(known_good 模式：跳过 user/gaming/boost/gsi 四份追加，只保留 KSU + 署名 + 黑匣子)"
          fi
          # 黑匣子批次（始终应用：AEE/pstore/panic 自动重启，保证"起不来"时留下证据）
          cat $GITHUB_WORKSPACE/buildfiles/Patches/ares_blackbox_defconfig_append >> arch/arm64/configs/ares_defconfig
          if [ "${{ inputs.enable_bbg }}" != "true" ]; then
            sed -i '/^CONFIG_BBG=y$/d' arch/arm64/configs/ares_defconfig
          fi
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            if [ "${{ inputs.ksu_variant }}" = "official" ]; then
              {
                echo 'CONFIG_KPROBES=y'
                echo 'CONFIG_KPROBE_EVENTS=y'
                echo 'CONFIG_KRETPROBES=y'
                echo 'CONFIG_KSU=y'
              } >> arch/arm64/configs/ares_defconfig
            else
              {
                echo 'CONFIG_KSU=y'
                echo 'CONFIG_KSU_MANUAL_HOOK=y'
                echo 'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y'
              } >> arch/arm64/configs/ares_defconfig
            fi
          fi
          # 署名：内核版本串与构建者都写 YangXin2026
          {
            echo 'CONFIG_LOCALVERSION="-YangXin2026"'
            echo 'CONFIG_DEFAULT_HOSTNAME="ares"'
          } >> arch/arm64/configs/ares_defconfig
          echo "--- defconfig 尾部 ---"; tail -16 arch/arm64/configs/ares_defconfig

      - name: 编译
        working-directory: kernel
        run: |
          set -o pipefail
          mkdir -p $GITHUB_WORKSPACE/artifacts
          export KBUILD_BUILD_TIMESTAMP=$(date)
          export KBUILD_BUILD_USER=YangXin2026
          export KBUILD_BUILD_HOST=ares-build
          export PATH=/usr/lib/ccache:$PATH
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang LD=ld.lld HOSTLD=ld.lld KCFLAGS+=-O2 CONFIG_MTK_COMBO_WIFI_HIF=axi ares_defconfig all 2>&1 \
            | tee -a $GITHUB_WORKSPACE/artifacts/build.log | tail -80
          echo "=== 产物 ==="
          ls -l out/arch/arm64/boot/ || true
          ls -l out/arch/arm64/boot/dts/mediatek/ 2>/dev/null | head -20 || true
          echo "KERNELRELEASE=$(cat out/include/config/kernel.release 2>/dev/null || make -s O=out kernelrelease)" >> $GITHUB_ENV

      - name: 导出生效配置（跟"已验证配置"对比用；失败也导出）
        if: always()
        working-directory: kernel
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp out/.config $GITHUB_WORKSPACE/artifacts/config-effective 2>/dev/null && echo "config 已导出" || echo "(没有 out/.config)"
          cp out/include/config/kernel.release $GITHUB_WORKSPACE/artifacts/kernel-release 2>/dev/null || true
          cat $GITHUB_WORKSPACE/artifacts/kernel-release 2>/dev/null || true

      - name: 编译内核模块 (.ko)
        if: ${{ inputs.build_modules }}
        working-directory: kernel
        run: |
          set -o pipefail
          mkdir -p $GITHUB_WORKSPACE/artifacts
          export KBUILD_BUILD_TIMESTAMP=$(date)
          export KBUILD_BUILD_USER=YangXin2026
          export KBUILD_BUILD_HOST=ares-build
          export PATH=/usr/lib/ccache:$PATH
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CC=clang LD=ld.lld KCFLAGS+=-O2 modules 2>&1 \
            | tee -a $GITHUB_WORKSPACE/artifacts/modules.log | tail -40
          KOCOUNT=$(find out -name '*.ko' | wc -l)
          echo "编出模块数: $KOCOUNT"
          echo "KOCOUNT=$KOCOUNT" >> $GITHUB_ENV
          echo "===== vermagic (GSI 能否加载模块就看它) ====="
          KO=$(find out -name '*.ko' | head -1)
          strings "$KO" | grep -m1 '^vermagic=' | tee $GITHUB_WORKSPACE/artifacts/vermagic.txt || true
          KREL=$(cat out/include/config/kernel.release 2>/dev/null || echo unknown)
          echo "kernel.release = $KREL" | tee -a $GITHUB_WORKSPACE/artifacts/vermagic.txt
          echo "ko_count = $KOCOUNT" | tee -a $GITHUB_WORKSPACE/artifacts/vermagic.txt
          echo "===== 关键模块是否编出 (WiFi/蓝牙/指纹/连接/性能) ====="
          for n in wlan_drv_gen4m bt_drv_6893 connfem conninfra gps_drv fpsgo sla met wmt_chrdev_wifi; do
            f=$(find out -name "$n.ko" | head -1)
            if [ -n "$f" ]; then echo "  OK   $n -> $f"; else echo "  MISS $n"; fi
          done | tee -a $GITHUB_WORKSPACE/artifacts/vermagic.txt
          echo "===== 打包模块 (保留目录结构 + 依赖清单) ====="
          ( cd out && find . \( -name '*.ko' -o -name 'modules.order' -o -name 'modules.builtin' \) -print0 \
              | tar --null -czf $GITHUB_WORKSPACE/artifacts/modules-${KREL}.tar.gz -T - ) || true
          ls -l $GITHUB_WORKSPACE/artifacts/ || true
          tar -tzf $GITHUB_WORKSPACE/artifacts/modules-${KREL}.tar.gz 2>/dev/null | head -20 || true

      - name: WireGuard 模块（out-of-tree）
        if: ${{ inputs.enable_wireguard }}
        continue-on-error: true
        working-directory: kernel
        run: |
          set -x
          git clone --depth 1 https://github.com/WireGuard/wireguard-linux-compat wgcompat
          make -j$(nproc --all) -C "$PWD" M="$PWD/wgcompat/src" O="$PWD/out" \
            ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld modules || \
          make -j$(nproc --all) -C "$PWD" M="$PWD/wgcompat/src" \
            ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld modules
          mkdir -p $GITHUB_WORKSPACE/artifacts/modules
          find . -name 'wireguard.ko' -exec cp {} $GITHUB_WORKSPACE/artifacts/modules/ \;
          ls -l $GITHUB_WORKSPACE/artifacts/modules || true

      - name: 打包产物
        working-directory: kernel
        run: |
          set -e
          mkdir -p $GITHUB_WORKSPACE/artifacts
          A=$GITHUB_WORKSPACE/artifacts
          test -f out/arch/arm64/boot/Image && cp out/arch/arm64/boot/Image $A/Image
          if [ -f out/arch/arm64/boot/Image.gz ]; then cp out/arch/arm64/boot/Image.gz $A/Image.gz; else gzip -9 -c out/arch/arm64/boot/Image > $A/Image.gz; fi
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then cp out/arch/arm64/boot/Image.gz-dtb $A/; fi
          for f in out/arch/arm64/boot/dts/mediatek/dtb.img out/arch/arm64/boot/dts/mediatek/ares.dtb out/arch/arm64/boot/dts/mediatek/mt6893.dtb; do
            [ -f "$f" ] && cp "$f" $A/ || true
          done
          cp out/arch/arm64/boot/System.map $A/ 2>/dev/null || true
          cp out/.config $A/config 2>/dev/null || true
          ls -l $A
          ( cd $A && sha256sum * > SHA256SUMS.txt )
          cat $A/SHA256SUMS.txt

      - name: 打包 AnyKernel3 直刷 zip
        continue-on-error: true
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git README.md .github
          if [ -f $GITHUB_WORKSPACE/artifacts/Image.gz-dtb ]; then
            cp $GITHUB_WORKSPACE/artifacts/Image.gz-dtb ./Image.gz-dtb
          else
            cp $GITHUB_WORKSPACE/artifacts/Image.gz ./Image.gz
          fi
          cat > anykernel.sh <<'EOF'
          kernel.string=YangXin2026 ares kernel 4.14.357-openela
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ares
          device.name2=aresin
          device.name3=M2012K10C
          supported.versions=12 - 16
          supported.patchlevels=
          BLOCK=boot
          IS_SLOT_DEVICE=1
          EOF
          zip -r9 "$GITHUB_WORKSPACE/artifacts/ak3-ares-${KERNELRELEASE}.zip" . -x '*.git*'
          ls -lh $GITHUB_WORKSPACE/artifacts/

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('build-{0}{1}', env.KSUVER || 'noksu', github.run_number) }}
          name: "ares kernel ${{ env.KERNELRELEASE }} (KSU=${{ inputs.enable_ksu }})"
          body: |
            源码: ${{ inputs.source_repo }}@${{ inputs.source_ref }}  源码HEAD: ${{ env.SRC_HEAD }}
            版本: ${{ env.KERNELRELEASE }}
            KernelSU: ${{ inputs.enable_ksu }} (ver ${{ env.KSUVER }})
            BBG: ${{ inputs.enable_bbg }}
            真机: Redmi K40 Gaming (ares / MT6893)
          files: |
            artifacts/*
            artifacts/modules/*
          draft: false

      - name: 发布日志（无论成败，日志都进这个 release）
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: "CI logs (latest)"
          body: "run ${{ github.run_number }} / ${{ inputs.release_tag }}"
          files: |
            artifacts/build.log
            artifacts/config-effective
            artifacts/kernel-release
            artifacts/vermagic.txt
          prerelease: true

      - name: 备用 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-kernel-run${{ github.run_number }}
          path: artifacts/*
          compression-level: 9
          if-no-files-found: warn
